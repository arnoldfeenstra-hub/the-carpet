[project]
name = "the-carpet"
version = "0.1.0"
description = "A descriptive rotation screener for Hyperliquid perps, reverse-engineered from screenshots."
requires-python = ">=3.11"
# None at runtime: api/carpet.py runs as a Vercel function on the stdlib alone.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The chart labels its boxes "BOX ×3", with a multiplication sign, as the screen it
# was reverse-engineered from does.
"rotation/chart.py" = ["RUF001"]
"tests/test_rotation.py" = ["RUF001"]
