# Lint and the test suite, on every push and every pull request. The suite needs no
# network: tests/conftest.py blocks urllib, so a test that tried to reach Hyperliquid
# fails here the same way it fails locally.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Tests
        run: python -m pytest -q
